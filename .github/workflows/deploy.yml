name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Install dependencies (if needed)
        run: npm install
        
      - name: Set AWS Secrets in Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler secret put AWS_ACCESS_KEY_ID <<< "${{ secrets.AWS_ACCESS_KEY_ID }}"
          wrangler secret put AWS_SECRET_ACCESS_KEY <<< "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --name cloudflare-worker-sqs
